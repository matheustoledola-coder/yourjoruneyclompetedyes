
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validating research</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: #ffffff;
    }

    #status {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 25.5%;
      font-size: 36px;
      line-height: 1.2;
      font-weight: 800;
      color: #000000;
      letter-spacing: -1px;
    }

    .progress-track {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 14.8%;
      height: 10px;
      background: #d9d9d9;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #fe2b54;
      border-radius: 20px;
      animation: progress 3s linear forwards;
    }

    @keyframes progress {
      0%   { width: 0%; }
      100% { width: 100%; }
    }

    @media (max-width: 600px) {
      #status {
        font-size: 36px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1 id="status">Verifying profile...</h1>

    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>
  </main>

  <script>
    const destino = "/index.html";
    const status = document.getElementById("status");

    setTimeout(() => {
      status.textContent = "Verified profile...";
    }, 1000);

    setTimeout(() => {
      status.textContent = "Redirecting...";
    }, 2000);

    setTimeout(() => {
      window.location.replace(destino);
    }, 3000);
  </script>


</body>
</html>
